name: 🐛 Bug report
description: Report an issue with the Vivit Energy integration
title: "[Bug]: "
labels: ["bug"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug 🙌  
        Please fill out the following information to help reproduce the issue.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is the problem?
      placeholder: Describe what is happening...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can the issue be reproduced?
      placeholder: |
        1. Go to...
        2. Configure...
        3. See error...
    validations:
      required: true

  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
      placeholder: e.g. 2026.4.2

  - type: input
    id: integration_version
    attributes:
      label: Integration version
      placeholder: e.g. latest / commit / version

  - type: dropdown
    id: installation
    attributes:
      label: Installation method
      options:
        - HACS
        - Manual
        - Docker
        - Other

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Paste relevant logs (Home Assistant logs or integration logs)
      render: yaml

  - type: textarea
    id: config
    attributes:
      label: Configuration
      description: Remove any sensitive data before sharing
      render: yaml

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / Graphs
      description: If applicable, add screenshots

  - type: textarea
    id: additional
    attributes:
      label: Additional context
