name: ✨ Feature request
description: Suggest a new feature or improvement
title: "[Feature]: "
labels: ["type: enhancement", "status: needs triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thanks for your suggestion! 🚀

  - type: dropdown
    id: area
    attributes:
      label: Related area
      options:
        - Authentication / login
        - Contracts / configuration flow
        - Consumption / costs
        - Invoices
        - Virtual battery
        - Sensors / entities
        - Installation / HACS
        - Translations
        - Performance
        - Security
        - Documentation
        - Other / not sure
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Feature description
      description: What would you like to see?
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem it solves
      description: What problem does this feature solve?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How do you imagine it working?

  - type: textarea
    id: additional
    attributes:
      label: Additional context
