name: Publish v2.1.14

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v2.1.14.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Build ZIP
        run: |
          cd custom_components/repsol_vivit
          zip -r "$GITHUB_WORKSPACE/vivit-energy-ha.zip" . -x "*/__pycache__/*" "*.pyc" "*.pyo" ".DS_Store"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v2.1.14 vivit-energy-ha.zip --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "v2.1.14" --notes "Maintenance release: HACS now installs from vivit-energy-ha.zip so GitHub can count release downloads."
